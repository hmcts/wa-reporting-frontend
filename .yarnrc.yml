compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.17.1.cjs

packageExtensions:
  '@prisma/client@*':
    dependencies:
      '.prisma/client': '*'
  'prisma@*':
    dependencies:
      '.prisma/client': '*'

# GHSA-gcqx-w48m-w2h4: deepmerge 4.3.1 has no patched release.
# Jest-only configuration merging processes trusted repository config, not HTTP input.
# Remove this advisory-specific exception once Jest adopts a patched replacement.
npmAuditIgnoreAdvisories:
  - 1243505
